name: CI

on:
  # Scoped so a push to a branch with an open PR runs the suite once, not
  # twice: branches are covered by pull_request, main by push.
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A new push supersedes whatever was still running for the same ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint, tests and lane benchmark (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v7
        # The LFS payloads (demo video, weights, GIFs) are not needed here —
        # this job never runs a model or reads the demo clip.
        with:
          lfs: false

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-test.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-test.txt

      - name: Lint
        run: ruff check .

      - name: Tests
        run: pytest -q

      - name: Lane benchmark
        # Frames come from a fixed seed, so this scores identically on every
        # run and every machine — a real regression gate rather than a flaky
        # threshold. The pipeline currently scores ~95%; the failure mode this
        # is guarding against (averaging in the neighbouring lane marking)
        # drops it to ~29%.
        run: python scripts/evaluate_lanes.py --frames 300 --min-pass 90

      - name: Lane benchmark, adverse conditions
        run: python scripts/evaluate_lanes.py --frames 300 --difficulty 2.0 --min-pass 85

  end-to-end:
    name: Full pipeline with YOLO weights
    runs-on: ubuntu-latest
    # Installing torch costs a few minutes, so this runs on main and on demand
    # rather than on every push to a branch.
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v7
        with:
          lfs: false

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-test.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # CPU wheels only: the default index pulls ~2.5 GB of CUDA libraries
          # that a GitHub runner has no GPU to use.
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt -r requirements-test.txt

      - name: Fetch YOLO weights
        # Downloaded into a scratch directory rather than the working tree, so
        # the repository's Git LFS pointer for yolov8n.pt is left alone.
        env:
          YOLO_CONFIG_DIR: ${{ runner.temp }}/ultralytics
        run: |
          mkdir -p "$RUNNER_TEMP/weights"
          cd "$RUNNER_TEMP/weights"
          python -c "from ultralytics import YOLO; YOLO('yolov8n.pt')"

      - name: Tests, including the end-to-end pipeline
        env:
          PERCEPTAV_TEST_MODEL: ${{ runner.temp }}/weights/yolov8n.pt
          YOLO_CONFIG_DIR: ${{ runner.temp }}/ultralytics
        run: pytest -q

      - name: Confirm the working tree is unchanged
        # process_video/process_image load the model only after validating
        # their input, so a test run must never trigger a weights download
        # into the repository. This catches it if that ordering regresses.
        run: git diff --exit-code
